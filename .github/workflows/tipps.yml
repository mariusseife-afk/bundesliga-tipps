name: Bundesliga Tipps

on:
  schedule:
    # GitHubs eigener schedule-Trigger ist auf oeffentlichen Repos nicht
    # verlaesslich (04.-04.09.2026 gemessen: Median 88 statt 15 Minuten,
    # groesste Luecke 819 Minuten - das liess Tipps zu spaet oder gar nicht
    # ankommen). Bleibt trotzdem als kostenloses Backup aktiv, ersetzt aber
    # NICHT den externen Trigger unten - siehe repository_dispatch.
    - cron: "*/15 * * * *"
  repository_dispatch:
    # Externer Cron-Dienst (z.B. cron-job.org) ruft alle paar Minuten
    #   POST https://api.github.com/repos/<repo>/dispatches
    #   Body: {"event_type": "tipp-lauf"}
    # mit einem Personal-Access-Token auf. Das ist der eigentliche,
    # zuverlaessige Trigger - siehe ANLEITUNG_EXTERNER_CRON.md.
    types: [tipp-lauf]
  workflow_dispatch:        # Knopf "Run workflow" in der Actions-Oberflaeche

permissions:
  contents: write

concurrency:
  group: tipps
  cancel-in-progress: false   # laufende Sendung nie mittendrin abbrechen

jobs:
  tippen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tipps rechnen und verschicken
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python run.py

      - name: Geaenderten Stand zuruecklegen
        run: |
          git config user.name  "tipp-bot"
          git config user.email "tipp-bot@users.noreply.github.com"
          git add -A config.json state.json docs data
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
          else
            git commit -m "Tipps aktualisiert: $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Zwischenzeitlich fremde Commits nicht ueberschreiben
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
